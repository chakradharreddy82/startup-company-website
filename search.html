<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search All Records</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body class="bg-light">

  <!-- Search Box -->
  <div class="container py-5">
    <div class="text-center mb-4">
      <h2>Search Records</h2>
      <p class="text-muted">Search by name in Quotes and Contacts</p>
    </div>
    <div class="d-flex justify-content-center">
      <div class="input-group" style="max-width: 600px;">
        <input
          type="text"
          id="searchInput"
          class="form-control border-primary p-3"
          placeholder="Type search keyword"
        />
        <button id="searchButton" class="btn btn-primary px-4">
          <i class="bi bi-search"></i> Search
        </button>
      </div>
    </div>
  </div>

  <!-- Search Results -->
  <div class="container mb-5" id="searchResults"></div>

  <script>
    const BASE_URL = "http://localhost:5000"; // Change to your Render URL in production

    $("#searchButton").on("click", function () {
      const keyword = $("#searchInput").val().trim();
      if (!keyword) {
        alert("Please enter a search keyword.");
        return;
      }

      $.get(`${BASE_URL}/api/search`, { key: keyword })
        .done(function (response) {
          renderResults(response);
        })
        .fail(function () {
          $("#searchResults").html(`<div class="alert alert-danger">Search failed. Try again later.</div>`);
        });
    });

    $("#searchInput").keypress(function (e) {
      if (e.which === 13) $("#searchButton").click();
    });

    function renderResults(data) {
      const container = $("#searchResults");
      container.empty();

      if (!data.quotes.length && !data.contacts.length) {
        container.html(`<div class="alert alert-warning text-center">No records found.</div>`);
        return;
      }

      // Quotes
      if (data.quotes.length) {
        container.append(`<h4 class="mb-3 border-bottom pb-2">Quotes</h4>`);
        data.quotes.forEach(quote => {
          container.append(`
            <div class="card mb-3 shadow-sm">
              <div class="card-body">
                <h5 class="card-title">${quote.name}</h5>
                <p><strong>Email:</strong> ${quote.email}</p>
                <p><strong>Service:</strong> ${quote.service}</p>
                <p><strong>Message:</strong> ${quote.message}</p>
                <small class="text-muted">Created At: ${new Date(quote.createdAt).toLocaleString()}</small>
              </div>
            </div>
          `);
        });
      }

      // Contacts
      if (data.contacts.length) {
        container.append(`<h4 class="mt-4 mb-3 border-bottom pb-2">Contacts</h4>`);
        data.contacts.forEach(contact => {
          container.append(`
            <div class="card mb-3 shadow-sm">
              <div class="card-body">
                <h5 class="card-title">${contact.name}</h5>
                <p><strong>Email:</strong> ${contact.email}</p>
                <p><strong>Subject:</strong> ${contact.subject}</p>
                <p><strong>Message:</strong> ${contact.message}</p>
                <small class="text-muted">Created At: ${new Date(contact.createdAt).toLocaleString()}</small>
              </div>
            </div>
          `);
        });
      }
    }
  </script>

</body>
</html>
